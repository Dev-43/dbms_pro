<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Booking — Fleet Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">FLEET MANAGER</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="vehicles.html">Vehicles</a>
    <a href="customers.html">Customers</a>
    <a href="bookings.html" class="active">Bookings</a>
    <a href="payments.html">Payments</a>
    <a href="maintenance.html">Maintenance</a>
    <a href="fuel.html">Fuel Logs</a>
    <a href="reports.html">Reports</a>
    <a href="categories.html">Categories</a>
    <a href="users.html">Users</a>
    <div class="spacer"></div>
    <a href="login.html">Logout</a>
  </aside>
  <main class="main">
    <div class="page-header">
      <h1>New Booking</h1>
      
    </div>
    <div class="card">
      <div class="alert alert-error">Vehicle is already booked for these dates</div>
      <form>
        <div class="form-grid">
          <div class="field"><label>Customer</label><select><option>Ravi Kulkarni</option><option>Sneha Patil</option></select></div>
          <div class="field"><label>Vehicle</label><select><option>MH12 AB 4521 — Swift LXi</option><option>MH14 CD 7788 — Honda City</option></select></div>
          <div class="field"><label>Start date</label><input type="date"></div>
          <div class="field"><label>End date</label><input type="date"><span class="hint">Return date must be after the start date.</span></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="button">Save</button>
          <a class="btn" href="bookings.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
