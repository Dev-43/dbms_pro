<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Fleet Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand">FLEET MANAGER</div>
    <h2>Staff Login</h2>
    <div class="sub">Sign in to manage vehicles and bookings.</div>
    <div class="alert alert-error">Invalid email or password</div>
    <form>
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="admin@rental.local"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password"></div>
      <a class="btn btn-primary" href="dashboard.html">Login</a>
    </form>
  </div>
</div>
</body>
</html>
